<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ПР-2 Нефроида</title>
  <link rel="stylesheet" href="CSS/style.css">
  <script src="d3.v7.min.js"></script>
</head>
<body>
  <form id="form">
    <label>Длительность (мс):</label><input type="number" id="duration" value="5000" min="500"><br>
    <label>Масштаб:</label><input type="number" id="scale" value="1" min="0.5" max="2" step="0.1"><br>
    <label>Вращение (°/сек):</label><input type="number" id="rotation" value="90"><br>
    <button type="button" id="btn-start">Запустить</button>
    <button type="button" id="btn-clear">Очистить</button>
  </form>
  <svg id="svg"></svg>
  <script src="JavaScript/main.js"></script>
</body>
</html>
