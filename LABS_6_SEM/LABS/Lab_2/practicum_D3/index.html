<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Лабораторная работа 4</title>
  <link rel="stylesheet" href="CSS/style.css">
  <script src="../d3.v7.min.js"></script>
  <script src="JavaScript/image.js"></script>
  <script src="JavaScript/path.js"></script>
  <script src="JavaScript/main.js"></script>
</head>
<body>
  <form id="setting">
    <div class="form-row">
      <div id="block_coords">
        <p>Координаты рисунка<br>
          <label for="cx">x: </label>
          <input type="number" id="cx" name="cx" value="300" max="600" min="0">
          <span id="coords_to_x" class="hidden"> до <input type="number" id="cx_finish" name="cx_finish" value="550" max="600" min="0"></span><br>
          <label for="cy">y: </label>
          <input type="number" id="cy" name="cy" value="300" max="600" min="0">
          <span id="coords_to_y" class="hidden"> до <input type="number" id="cy_finish" name="cy_finish" value="550" max="600" min="0"></span>
        </p>
      </div>
      <div id="block_path" class="hidden">
        <p>Пути перемещения<br>
          <select id="path_type" name="path_type">
            <option value="0">Буквой «Г»</option>
            <option value="1">По кругу</option>
          </select>
        </p>
      </div>
      <div id="block_scale">
        <p>Масштаб<br>
          <label for="scale_x">по x: </label>
          <input type="number" id="scale_x" name="scale_x" value="1" min="0.1" step="0.1">
          <span id="scale_to_x" class="hidden"> до <input type="number" id="scale_x_finish" name="scale_x_finish" value="1.5" min="0.1" step="0.1"></span><br>
          <label for="scale_y">по y: </label>
          <input type="number" id="scale_y" name="scale_y" value="1" min="0.1" step="0.1">
          <span id="scale_to_y" class="hidden"> до <input type="number" id="scale_y_finish" name="scale_y_finish" value="1.5" min="0.1" step="0.1"></span>
        </p>
      </div>
      <div id="block_rotate">
        <p>Поворот<br>
          <label for="rotate">угол: </label>
          <input type="number" id="rotate" name="rotate" value="0">
          <pan id="rotate_to" class="hidden"> до <input type="number" id="rotate_finish" name="rotate_finish" value="180"></span>
        </p>
      </div>
    </div>
    <div class="form-controls">
      <p>
        <label><input type="checkbox" id="anim_enabled"> Включить анимацию?</label>
        <span id="ease_block" class="hidden">
          <select id="ease_type" name="ease_type">
            <option value="linear">linear</option>
            <option value="elastic">elastic</option>
            <option value="bounce">bounce</option>
          </select>
        </span>
      </p>
      <p id="path_check_block" class="hidden">
        <label><input type="checkbox" id="path_enabled"> Перемещение вдоль пути?</label>
      </p>
      <p>
        <input type="button" id="btn_draw" value="Нарисовать">
        <input type="button" id="btn_clear" value="Очистить">
        <input type="button" id="btn_animate" class="hidden" value="Анимировать">
      </p>
    </div>
  </form>
  <svg></svg>
</body>
</html>
